# supabase/config.toml
# ShareSphere — Supabase local development configuration
# ============================================================
# This file configures the local Supabase stack (Docker-based).
# Fill in your real project_id after running `supabase init`
# in this directory, or when you link to a remote project.
#
# Docs: https://supabase.com/docs/guides/cli/config
# ============================================================

[api]
# Local REST API port (default: 54321)
port = 55321
# Schemas exposed through the REST API
schemas = ["public", "graphql_public"]
# Extra schemas visible to the anon and service_role
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
# Local Postgres port (default: 54322)
port = 55322
# Target Postgres major version — match your Supabase project's version
major_version = 15

[studio]
# Supabase Studio (local dashboard) port (default: 54323)
port = 55323
api_url = "http://localhost"

[inbucket]
# Local email testing server (default: 54324)
port = 55324
smtp_port = 55325
pop3_port = 55326

[storage]
# Maximum file upload size (examples: "5MB", "10MB")
file_size_limit = "50MiB"

[auth]
# Site URL — update this when deploying
site_url = "http://localhost:5173"
# Additional redirect URLs allowed for auth callbacks
additional_redirect_urls = ["https://localhost:5173"]
# JWT expiry in seconds (default: 3600 = 1 hour)
jwt_expiry = 3600
# Enable/disable email sign-up
enable_signup = true

[auth.email]
# Require email confirmation before sign-in
enable_confirmations = false

# ── Remote project (fill in after `supabase link`) ───────────────────────────
# [project]
# project_id = "your-project-ref-goes-here"

[analytics]
enabled = true
port = 55327
